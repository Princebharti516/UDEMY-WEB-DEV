<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1a1a1a;

    .card{
        padding: 30px;
        border-radius: 10px;
        background-color: #a5a0a0;
        width: 300px;
    }

    h2 {
        text-align: center;
        color: #2236a9;
        margin-bottom: 20px;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    input{
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #191818;
        border-radius: 5px;
        background-color: #aca9a9;
    }

    button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #2236a9;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #1a2a8a;
    }
}
</style>

<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="Email" />
            <input type="password" placeholder="Password" />
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
